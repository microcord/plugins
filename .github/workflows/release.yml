name: Release

# On every push to main, builds the plugins whose versionCode changed and publishes them on the
# `builds` branch with a new plugins.json; see scripts/release.py. Bumping a plugin's versionCode is
# what releases it.
#
# Needs these repository secrets:
# - PLUGIN_KEYSTORE_BASE64, PLUGIN_KEYSTORE_PASSWORD, PLUGIN_KEY_ALIAS, PLUGIN_KEY_PASSWORD: the
#   shared plugin signing key.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the builds branch
        run: |
          if git ls-remote --exit-code origin refs/heads/builds >/dev/null; then
            git fetch -q origin builds
            git worktree add -q builds-out origin/builds
            git -C builds-out switch -q -C builds
          else
            git worktree add -q --orphan -b builds builds-out
          fi
          git -C builds-out config user.name "github-actions[bot]"
          git -C builds-out config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build changed plugins and update the index
        env:
          PLUGIN_KEYSTORE_PASSWORD: ${{ secrets.PLUGIN_KEYSTORE_PASSWORD }}
          PLUGIN_KEY_ALIAS: ${{ secrets.PLUGIN_KEY_ALIAS }}
          PLUGIN_KEY_PASSWORD: ${{ secrets.PLUGIN_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.PLUGIN_KEYSTORE_BASE64 }}
        run: |
          export PLUGIN_KEYSTORE="$RUNNER_TEMP/plugins.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$PLUGIN_KEYSTORE"
          python3 scripts/release.py builds-out
          rm -f "$PLUGIN_KEYSTORE"

      - name: Publish
        run: |
          git -C builds-out push -q origin builds
          # plugins.json is read through a branch link, which jsDelivr caches; APK links are commit pinned.
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/plugins.json" >/dev/null
