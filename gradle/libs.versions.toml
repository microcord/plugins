[versions]
agp = "9.2.1"
rxjava = "1.3.8"
recyclerview = "1.4.0"
appcompat = "1.7.1"
fresco = "3.7.0"
material = "1.3.0"
microcord-plugin-api = "1.0.6"

[libraries]
rxjava = { group = "io.reactivex", name = "rxjava", version.ref = "rxjava" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
fresco-drawee-span = { group = "com.facebook.fresco", name = "drawee-span", version.ref = "fresco" }
fresco = { group = "com.facebook.fresco", name = "fresco", version.ref = "fresco" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
microcord-plugin-api = { group = "dev.mantikafasi.manticord", name = "plugin-api", version.ref = "microcord-plugin-api" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
